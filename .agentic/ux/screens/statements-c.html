<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Variant C: to-do queue</title><style>:root{--bg:#f7f5f0;--surface:#fff;--sunk:#eef0ee;--border:#d5dbdc;--text:#122630;--muted:#4a5d66;--accent:#0d5560;--accent-hover:#093f48;--on-accent:#fff;--accent-soft:#dcecec;--brass:#8a5a12;--danger:#a8231b;--success:#1c6640;--success-soft:#e0f0e6;--focus:#c27a0e;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--sm:13px;--md:15px;--lg:19px;--xl:26px;--s-xs:4px;--s-sm:8px;--s-md:16px;--s-lg:24px;--s-xl:40px;--r-sm:4px;--r-md:8px;--shadow:0 1px 2px rgba(18,38,48,.08),0 2px 8px rgba(18,38,48,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:var(--md)/1.5 var(--font)}a{color:var(--accent)}:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.num{font-variant-numeric:tabular-nums}

main{padding:var(--s-xl)}.steps{display:flex;gap:var(--s-md);margin:var(--s-md) 0 var(--s-lg)}.step{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s-md)}.step b{display:block;font-size:var(--xl)}.todo{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s-md) var(--s-lg)}.todo label{display:flex;gap:var(--s-md);align-items:center;padding:var(--s-sm) 0;border-bottom:1px solid var(--border)}.todo label:last-child{border:0}.todo span{flex:1}button{font:inherit;background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--r-sm);padding:8px 14px}@media(max-width:700px){.shell{grid-template-columns:1fr}nav{display:none}main{padding:var(--s-md)}.steps{flex-direction:column}}</style></head><body>
